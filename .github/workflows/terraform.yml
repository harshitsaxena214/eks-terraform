name: Terraform CI

# Uses GitHub OIDC to authenticate to AWS. No long-lived AWS credentials are stored.
# See: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - "backend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to validate (dev, staging, prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.6.6"
  AWS_REGION: "us-east-1"

jobs:
  terraform-check:
    name: Format and Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [dev, staging, prod]
        layer: [infra, kubernetes]
      fail-fast: false

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}/${{ matrix.layer }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Skips remote backend connection because CI doesn't need state access for fmt/validate
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan-dev:
    name: Plan DEV
    runs-on: ubuntu-latest
    needs: terraform-check
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        layer: [infra, kubernetes]
      fail-fast: false

    defaults:
      run:
        working-directory: environments/dev/${{ matrix.layer }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/${{ matrix.layer }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        run: |
          if [ "${{ matrix.layer }}" == "infra" ]; then
            terraform plan -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" -no-color
          else
            terraform plan -var="cluster_name=eks-three-stage-dev-cluster" -no-color
          fi
        continue-on-error: true
